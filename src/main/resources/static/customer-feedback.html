<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapPro - Customer Feedback</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f5f8;
            color: #333;
        }

        .header {
            height: 72px;
            background: #222;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 38px;
        }

        .logo {
            font-size: 25px;
            font-weight: 700;
        }

        .role {
            font-size: 16px;
            font-weight: 500;
        }

        .container {
            padding: 35px 38px 60px;
        }

        h1 {
            margin: 0 0 28px;
            font-size: 32px;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        button {
            border: none;
            border-radius: 5px;
            padding: 11px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .refresh-btn {
            background: #2867e8;
            color: white;
        }

        .refresh-btn:hover {
            background: #1856d1;
        }

        .message {
            display: none;
            padding: 15px 18px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .error {
            background: #ffdede;
            color: #b42318;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .statistics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .stat-title {
            color: #666;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 30px;
            font-weight: 700;
        }

        .filter-section {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        select {
            height: 40px;
            min-width: 185px;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 0 10px;
            background: white;
            font-size: 14px;
        }

        .filter-btn {
            background: #2867e8;
            color: white;
        }

        .escalated-btn {
            background: #ed8b00;
            color: white;
        }

        .show-all-btn {
            background: #687386;
            color: white;
        }

        .table-container {
            background: white;
            border-radius: 8px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
        }

        thead {
            background: #f7f8fa;
        }

        th {
            text-align: left;
            padding: 16px 14px;
            font-size: 14px;
            font-weight: 700;
            border-bottom: 1px solid #ddd;
        }

        td {
            padding: 15px 14px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            vertical-align: top;
        }

        tbody tr:hover {
            background: #fafafa;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        .rating {
            font-weight: 700;
        }

        .rating-high {
            color: #16803c;
        }

        .rating-medium {
            color: #d97706;
        }

        .rating-low {
            color: #dc2626;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-resolved {
            background: #d1fae5;
            color: #065f46;
        }

        .status-published {
            background: #dbeafe;
            color: #1e40af;
        }

        .escalated {
            color: #dc2626;
            font-weight: 700;
        }

        .not-escalated {
            color: #16803c;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 7px 10px;
            font-size: 12px;
            color: white;
        }

        .respond-btn {
            background: #2867e8;
        }

        .escalate-action-btn {
            background: #dc2626;
        }

        .view-btn {
            background: #687386;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 600px;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            font-size: 28px;
            cursor: pointer;
            color: #666;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel-btn {
            background: #687386;
            color: white;
        }

        .save-btn {
            background: #2867e8;
            color: white;
        }

        @media (max-width: 800px) {
            .container {
                padding: 25px 18px;
            }

            .header {
                padding: 0 18px;
            }

            .statistics {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="logo">SnapPro - Customer Relations</div>
    <div class="role">Client Relations Officer</div>
</header>

<main class="container">

    <h1>Customer Feedback Management</h1>

    <div class="top-bar">
        <button class="refresh-btn" onclick="loadFeedback()">
            Refresh Feedback
        </button>
    </div>

    <div id="errorMessage" class="message error"></div>
    <div id="successMessage" class="message success"></div>

    <section class="statistics">

        <div class="stat-card">
            <div class="stat-title">Total Feedback</div>
            <div id="totalFeedback" class="stat-value">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">Average Rating</div>
            <div id="averageRating" class="stat-value">0.0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">Escalated Complaints</div>
            <div id="escalatedCount" class="stat-value">0</div>
        </div>

    </section>

    <section class="filter-section">

        <select id="statusFilter">
            <option value="">All Feedback</option>
            <option value="1">Pending</option>
            <option value="2">Resolved</option>
            <option value="3">Published</option>
        </select>

        <button class="filter-btn" onclick="filterFeedback()">
            Filter
        </button>

        <button class="escalated-btn" onclick="showEscalated()">
            Escalated Complaints
        </button>

        <button class="show-all-btn" onclick="showAll()">
            Show All
        </button>

    </section>

    <section class="table-container">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Customer ID</th>
                <th>Booking ID</th>
                <th>Rating</th>
                <th>Review</th>
                <th>Status</th>
                <th>CRO Response</th>
                <th>Escalated</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody id="feedbackTableBody">

            <tr>
                <td colspan="9" class="loading">
                    Loading feedback...
                </td>
            </tr>

            </tbody>

        </table>

    </section>

</main>

<div id="responseModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">
            <h2>Respond to Customer Feedback</h2>

            <span class="close" onclick="closeModal()">
                &times;
            </span>
        </div>

        <div class="form-group">

            <label>Feedback ID</label>

            <input
                    id="modalFeedbackId"
                    type="text"
                    readonly
                    style="
                        width:100%;
                        padding:10px;
                        border:1px solid #ccc;
                        border-radius:5px;
                    "
            >

        </div>

        <div class="form-group">

            <label>CRO Response</label>

            <textarea
                    id="croResponseInput"
                    placeholder="Enter your response to the customer..."
            ></textarea>

        </div>

        <div class="form-group">

            <label>Feedback Status</label>

            <select
                    id="modalStatus"
                    style="width:100%; height:42px;"
            >
                <option value="1">Pending</option>
                <option value="2">Resolved</option>
                <option value="3">Published</option>
            </select>

        </div>

        <div class="modal-actions">

            <button class="cancel-btn" onclick="closeModal()">
                Cancel
            </button>

            <button class="save-btn" onclick="saveResponse()">
                Save Response
            </button>

        </div>

    </div>

</div>

<script>

    const API_URL = "/api/cro/feedback";

    /*
     * TRUE  = use sample data
     * FALSE = use Spring Boot backend
     */
    const USE_SAMPLE_DATA = false;

    let feedbackData = [];
    let currentFeedbackId = null;

    const sampleFeedback = [
        {
            id: 1,
            customerId: 101,
            bookingId: 501,
            rating: 5,
            reviewText:
                "Excellent photography service. Very professional team.",
            feedbackStatusId: 2,
            croResponse:
                "Thank you for your valuable feedback.",
            escalatedToManager: false
        },
        {
            id: 2,
            customerId: 102,
            bookingId: 502,
            rating: 2,
            reviewText:
                "The photos were delivered late and I was not satisfied.",
            feedbackStatusId: 1,
            croResponse: "",
            escalatedToManager: false
        },
        {
            id: 3,
            customerId: 103,
            bookingId: 503,
            rating: 1,
            reviewText:
                "Very serious issue with the service. Please contact me.",
            feedbackStatusId: 1,
            croResponse: "",
            escalatedToManager: true
        },
        {
            id: 4,
            customerId: 104,
            bookingId: 504,
            rating: 4,
            reviewText:
                "Good service and high-quality photographs.",
            feedbackStatusId: 3,
            croResponse:
                "Thank you for your feedback.",
            escalatedToManager: false
        }
    ];

    document.addEventListener("DOMContentLoaded", function () {
        loadFeedback();
    });

    async function loadFeedback() {

        try {

            hideMessages();

            if (USE_SAMPLE_DATA) {

                feedbackData = [...sampleFeedback];

                displayFeedback(feedbackData);
                updateStatistics(feedbackData);

                return;
            }

            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Failed to load customer feedback.");
            }

            feedbackData = await response.json();

            displayFeedback(feedbackData);
            updateStatistics(feedbackData);

        } catch (error) {

            showError(error.message);

            document.getElementById("feedbackTableBody").innerHTML = `
                <tr>
                    <td colspan="9" class="loading">
                        Failed to load feedback.
                    </td>
                </tr>
            `;
        }
    }

    function displayFeedback(data) {

        const tbody =
            document.getElementById("feedbackTableBody");

        if (!data || data.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="9" class="loading">
                        No feedback found.
                    </td>
                </tr>
            `;

            return;
        }

        tbody.innerHTML = "";

        data.forEach(function (feedback) {

            const row = document.createElement("tr");

            const ratingClass =
                getRatingClass(feedback.rating);

            const statusName =
                getStatusName(feedback.feedbackStatusId);

            const statusClass =
                getStatusClass(feedback.feedbackStatusId);

            const escalation =
                feedback.escalatedToManager;

            row.innerHTML = `

                <td>${safeValue(feedback.id)}</td>

                <td>${safeValue(feedback.customerId)}</td>

                <td>${safeValue(feedback.bookingId)}</td>

                <td>
                    <span class="rating ${ratingClass}">
                        ${safeValue(feedback.rating)}/5
                    </span>
                </td>

                <td>
                    ${safeValue(feedback.reviewText)}
                </td>

                <td>
                    <span class="status ${statusClass}">
                        ${statusName}
                    </span>
                    <br>
                    <small>
                        ID:
                        ${safeValue(feedback.feedbackStatusId)}
                    </small>
                </td>

                <td>
                    ${
                        feedback.croResponse
                            ? safeValue(feedback.croResponse)
                            : "<em>No response</em>"
                    }
                </td>

                <td>
                    ${
                        escalation
                            ? `<span class="escalated">Yes</span>`
                            : `<span class="not-escalated">No</span>`
                    }
                </td>

                <td>

                    <div class="action-buttons">

                        <button
                            class="action-btn view-btn"
                            onclick="viewFeedback(${feedback.id})"
                        >
                            View
                        </button>

                        <button
                            class="action-btn respond-btn"
                            onclick="openResponseModal(${feedback.id})"
                        >
                            Respond
                        </button>

                        ${
                            !escalation
                                ? `
                                    <button
                                        class="action-btn escalate-action-btn"
                                        onclick="escalateFeedback(${feedback.id})"
                                    >
                                        Escalate
                                    </button>
                                `
                                : ""
                        }

                    </div>

                </td>
            `;

            tbody.appendChild(row);
        });
    }

    function updateStatistics(data) {

        const total = data.length;

        const ratings = data
            .map(item => Number(item.rating))
            .filter(rating => !isNaN(rating));

        let average = 0;

        if (ratings.length > 0) {

            average =
                ratings.reduce(
                    (sum, rating) => sum + rating,
                    0
                ) / ratings.length;
        }

        const escalated =
            data.filter(
                item => item.escalatedToManager === true
            ).length;

        document.getElementById("totalFeedback").textContent =
            total;

        document.getElementById("averageRating").textContent =
            average.toFixed(1);

        document.getElementById("escalatedCount").textContent =
            escalated;
    }

    function filterFeedback() {

        const status =
            document.getElementById("statusFilter").value;

        if (status === "") {

            displayFeedback(feedbackData);

            return;
        }

        const filtered =
            feedbackData.filter(
                feedback =>
                    String(feedback.feedbackStatusId) ===
                    String(status)
            );

        displayFeedback(filtered);
    }

    function showEscalated() {

        const filtered =
            feedbackData.filter(
                feedback =>
                    feedback.escalatedToManager === true
            );

        displayFeedback(filtered);
    }

    function showAll() {

        document.getElementById("statusFilter").value = "";

        displayFeedback(feedbackData);
    }

    function viewFeedback(id) {

        const feedback =
            feedbackData.find(
                item => Number(item.id) === Number(id)
            );

        if (!feedback) {

            showError("Feedback not found.");

            return;
        }

        alert(
            "Feedback Details\n\n" +
            "Feedback ID: " + feedback.id +
            "\nCustomer ID: " + feedback.customerId +
            "\nBooking ID: " + feedback.bookingId +
            "\nRating: " + feedback.rating +
            "/5\n\nReview:\n" +
            feedback.reviewText +
            "\n\nCRO Response:\n" +
            (feedback.croResponse || "No response")
        );
    }

    function openResponseModal(id) {

        const feedback =
            feedbackData.find(
                item => Number(item.id) === Number(id)
            );

        if (!feedback) {

            showError("Feedback not found.");

            return;
        }

        currentFeedbackId = feedback.id;

        document.getElementById("modalFeedbackId").value =
            feedback.id;

        document.getElementById("croResponseInput").value =
            feedback.croResponse || "";

        document.getElementById("modalStatus").value =
            feedback.feedbackStatusId;

        document.getElementById("responseModal").style.display =
            "flex";
    }

    function closeModal() {

        document.getElementById("responseModal").style.display =
            "none";

        currentFeedbackId = null;
    }

    async function saveResponse() {

        const responseText =
            document.getElementById("croResponseInput")
                .value
                .trim();

        const statusId =
            Number(
                document.getElementById("modalStatus").value
            );

        if (!responseText) {

            showError("Please enter a CRO response.");

            return;
        }

        if (USE_SAMPLE_DATA) {

            const feedback =
                feedbackData.find(
                    item =>
                        Number(item.id) ===
                        Number(currentFeedbackId)
                );

            if (feedback) {

                feedback.croResponse = responseText;
                feedback.feedbackStatusId = statusId;
            }

            displayFeedback(feedbackData);
            updateStatistics(feedbackData);

            closeModal();

            showSuccess(
                "Customer feedback updated successfully."
            );

            return;
        }

        try {

            const url =
                `${API_URL}/${currentFeedbackId}`;

            const params = new URLSearchParams();

            params.append("croResponse", responseText);
            params.append("feedbackStatusId", statusId);

            const response =
                await fetch(
                    url + "?" + params.toString(),
                    {
                        method: "PUT"
                    }
                );

            if (!response.ok) {
                throw new Error(
                    "Failed to update feedback."
                );
            }

            closeModal();

            showSuccess(
                "Customer feedback updated successfully."
            );

            await loadFeedback();

        } catch (error) {

            showError(error.message);
        }
    }

    async function escalateFeedback(id) {

        const confirmed =
            confirm(
                "Are you sure you want to escalate this complaint to the Operations Manager?"
            );

        if (!confirmed) {
            return;
        }

        const remarks =
            prompt("Enter escalation remarks:");

        if (
            remarks === null ||
            remarks.trim() === ""
        ) {
            return;
        }

        if (USE_SAMPLE_DATA) {

            const feedback =
                feedbackData.find(
                    item =>
                        Number(item.id) === Number(id)
                );

            if (feedback) {

                feedback.escalatedToManager = true;
                feedback.escalationRemarks = remarks;
            }

            displayFeedback(feedbackData);
            updateStatistics(feedbackData);

            showSuccess(
                "Feedback escalated to Operations Manager."
            );

            return;
        }

        try {

            const params = new URLSearchParams();

            params.append(
                "escalationRemarks",
                remarks
            );

            const response =
                await fetch(
                    `${API_URL}/${id}/escalate?${params.toString()}`,
                    {
                        method: "PUT"
                    }
                );

            if (!response.ok) {

                throw new Error(
                    "Failed to escalate feedback."
                );
            }

            showSuccess(
                "Feedback escalated successfully."
            );

            await loadFeedback();

        } catch (error) {

            showError(error.message);
        }
    }

    function getStatusName(statusId) {

        switch (Number(statusId)) {

            case 1:
                return "Pending";

            case 2:
                return "Resolved";

            case 3:
                return "Published";

            default:
                return "Unknown";
        }
    }

    function getStatusClass(statusId) {

        switch (Number(statusId)) {

            case 1:
                return "status-pending";

            case 2:
                return "status-resolved";

            case 3:
                return "status-published";

            default:
                return "";
        }
    }

    function getRatingClass(rating) {

        rating = Number(rating);

        if (rating >= 4) {
            return "rating-high";
        }

        if (rating >= 3) {
            return "rating-medium";
        }

        return "rating-low";
    }

    function safeValue(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function showError(message) {

        const error =
            document.getElementById("errorMessage");

        error.textContent = message;
        error.style.display = "block";

        document.getElementById("successMessage")
            .style.display = "none";
    }

    function showSuccess(message) {

        const success =
            document.getElementById("successMessage");

        success.textContent = message;
        success.style.display = "block";

        document.getElementById("errorMessage")
            .style.display = "none";

        setTimeout(
            function () {
                success.style.display = "none";
            },
            3000
        );
    }

    function hideMessages() {

        document.getElementById("errorMessage")
            .style.display = "none";

        document.getElementById("successMessage")
            .style.display = "none";
    }

    window.onclick = function (event) {

        const modal =
            document.getElementById("responseModal");

        if (event.target === modal) {
            closeModal();
        }
    };

</script>

</body>
</html>

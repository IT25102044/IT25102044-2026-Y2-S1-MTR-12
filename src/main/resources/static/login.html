<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapPro - Sign In</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root {
      --primary-accent: #2563eb;
      --primary-subtle: #eff6ff;
      --surface-card: #ffffff;
      --border-subtle: #e2e8f0;
      --body-bg: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    body {
      background-color: var(--body-bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      width: 100%;
      max-width: 440px;
      padding: 2.5rem 2rem;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--primary-accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 d-flex justify-content-center">
      <div class="auth-card">
        
        <!-- Brand Header -->
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 54px; height: 54px;">
            <i class="bi bi-camera-reels-fill fs-3"></i>
          </div>
          <h4 class="fw-bold mb-1">Welcome Back</h4>
          <p class="text-muted small mb-0">Sign in to your SnapPro account</p>
        </div>

        <!-- Login Form -->
        <form id="signInForm" onsubmit="event.preventDefault(); signIn();">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" id="signInEmail" class="form-control border-start-0" placeholder="name@domain.com" required />
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label small fw-semibold mb-0">Password</label>
              <a href="#" class="text-decoration-none small text-primary fw-semibold">Forgot?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" id="signInPassword" class="form-control border-start-0" placeholder="••••••••" required />
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked />
            <label class="form-check-label small text-muted" for="rememberMe">Remember my device</label>
          </div>

          <button type="button" class="btn btn-primary w-100 py-2 fw-semibold" onclick="signIn()">Sign In</button>
        </form>

        <!-- Footer -->
        <div class="text-center mt-4 pt-2 border-top">
          <p class="text-muted small mb-2">
            Don't have an account yet? 
            <a href="register.html" class="text-primary text-decoration-none fw-semibold">Create an account</a>
          </p>
          <div>
            <a href="customer-dashboard.html" class="text-muted text-decoration-none small">
              <i class="bi bi-arrow-left me-1"></i> Back to Packages & Home
            </a>
          </div>
        </div>


      </div>
    </div>
  </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Authentication JS -->
<script src="js/Admin&Customer/auth.js"></script>
</body>
</html>
